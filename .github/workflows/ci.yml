name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: bindings/go/go.mod

      # Crash simulation and every unit test, optimized.
      - run: zig build test -Drelease --summary all
      - run: zig build c-test
      - run: ./scripts/go-libs.sh
      - run: go test -race ./...
        working-directory: bindings/go

  # The parallel HNSW build under ThreadSanitizer (Linux only: it does not
  # build on recent macOS).
  tsan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build test -Dtsan --summary all

  # Release artifacts for every platform: the Go binding's static libraries
  # and the C archives (static and shared library, CLI).
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: The Go binding carries the same header
        run: cmp include/vectixdb.h bindings/go/include/vectixdb.h
      - run: STRIP=1 ./scripts/go-libs.sh all
      - run: ./scripts/dist.sh "$(sed -n 's/^ *\.version = "\(.*\)",/\1/p' build.zig.zon)"
