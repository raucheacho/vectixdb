name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: bindings/go/go.mod

      # Crash simulation and every unit test, optimized.
      - run: zig build test -Drelease --summary all
      - run: zig build c-test
      - run: ./scripts/go-libs.sh
      - run: go test -race ./...
        working-directory: bindings/go

  # The parallel HNSW build under ThreadSanitizer (Linux only: it does not
  # build on recent macOS).
  tsan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build test -Dtsan --summary all

  # Static libraries for every platform the Go binding supports.
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - run: ./scripts/go-libs.sh darwin_arm64 darwin_amd64 linux_amd64 linux_arm64
